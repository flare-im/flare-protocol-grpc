syntax = "proto3";

package flare.capability.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "errors.proto";
import "metadata.proto";
import "control_plane.proto";

// =============================================================================
// gRPC 服务（置顶：先见 API 面，再读 message / enum）
// =============================================================================

service CapabilityService {
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc Dispatch(DispatchCapabilityRequest) returns (DispatchCapabilityResponse);
  rpc SetTenantCapabilitySwitch(SetTenantCapabilitySwitchRequest) returns (SetTenantCapabilitySwitchResponse);
  rpc ListRegisteredPlugins(ListRegisteredPluginsRequest) returns (ListRegisteredPluginsResponse);
  rpc Administer(GenericRequest) returns (GenericResponse);
}

service HookPlugin {
  rpc Call(GenericRequest) returns (GenericResponse);
}

service ExtensionPlugin {
  rpc Call(GenericRequest) returns (GenericResponse);
}

// Plugin callbacks use the dedicated invocation ticket, never a user/Cell token.
// Hosted on the existing Capability listener; not a new gateway or service process.
service PluginHostBridge {
  rpc Call(GenericRequest) returns (GenericResponse);
}

// Trusted internal backend (Core -> Social). Requires a Cell-signed User context.
// This is deliberately distinct from the plugin-facing bridge audience.
service PluginResourceBackend {
  rpc Call(GenericRequest) returns (GenericResponse);
}

// 管理员只读（Console → admin-gateway → Capability）。authorization 携带 admin-gateway 原样转发的
// admin 令牌（aud=flare-core-admin、token_use=admin、员工主体、具体租户）；租户只取自令牌，请求不带
// tenant_id。数据只来自本进程持有的投影与开关表，网关不需要数据库角色。
// 单独成服务：已有 CapabilityService 实现不需要跟着改。
service CapabilityAdminService {
  rpc ListTenantCapabilitySwitches(ListTenantCapabilitySwitchesRequest) returns (ListTenantCapabilitySwitchesResponse);
  rpc GetTenantRuntime(GetTenantRuntimeRequest) returns (GetTenantRuntimeResponse);
}

// 租户配置变更通知（通用原语）。业务服务提交了某个租户的配置读模型后，发布「这个 topic 前进到
// version」；Core 按 (租户, topic) 保证版本单调后下发给该租户的在线连接（`DataPacket.tenant_notice`）。
// 调用方必须带 Cell 签名的服务身份（`x-flare-ctx`）：租户只取自签名（`*` 为全部租户），topic 必须落在
// 该服务登记的命名空间内；`flare.` 留给 Core 自己。Core 不解释 topic。
service TenantNoticeService {
  rpc Publish(PublishTenantNoticeRequest) returns (PublishTenantNoticeResponse);
}

message PublishTenantNoticeRequest {
  string topic = 1;    // 小写点分，最长 64 字节
  uint64 version = 2;  // 大于 0
}

message PublishTenantNoticeResponse {
  bool accepted = 1;         // 版本前进并已发布；false：已有不低于它的版本
  uint64 current_version = 2;
}

// ----------------------------------------------------------------------------
// GenericCall 载荷 — CapabilityService.Administer + HookPlugin.Call + ExtensionPlugin.Call
// ----------------------------------------------------------------------------
message GenericRequest {
  string operation = 1;
  map<string, string> metadata = 2;
  google.protobuf.Any payload = 3;
  string request_id = 4;
}

message GenericResponse {
  bool ok = 1;
  string request_id = 2;
  google.protobuf.Any payload = 3;
  string error_code = 4;
  string error_message = 5;
}

// flare.capability.v1 — 三服务控制面 + IM / 飞书式 Hook（开发期可任意 breaking，以契约为准）
//
// CapabilityService：目录、授权、Dispatch、租户开关；插件 endpoint 注册；Administer(operation+Any)。
// HookPlugin：消息发送前的同步拦截，仅 Call；显式 *Request/*Response + HookExtensionBag + HookRoutingHints。
// ExtensionPlugin：SFU/RTC/媒体/信令，仅 Call。
//
// HookPlugin.Call — operation -> payload message：
//   flare.hook.v1.pre_send -> PreSendHookRequest / PreSendHookResponse

// ----------------------------------------------------------------------------
// 消息与枚举
// ----------------------------------------------------------------------------

message ListCapabilitiesRequest {}

// 能力目录项：供 SDK / 编排器展示与决策；plugin_id 标识扩展实现，非 proto 内嵌类型。
message CapabilityDescriptor {
  string capability_id = 1;  // 命名空间能力 ID，如 rtc.call.video、billing.invoice
  string plugin_id = 2;  // 解析到的扩展实例或二进制名，用于路由与观测
  string version = 3;  // 能力实现或契约版本（semver 或内部号）
  string scope = 4;  // 作用域：tenant/user/conversation/global 等，字符串约定
  string visibility = 5;  // 可见性：public/internal/experimental
  repeated string permissions = 6;  // 细粒度权限标签，Dispatch 前校验子集
  repeated string message_types = 7;  // 若能力与消息类型绑定，列出允许的 message_type
  uint64 timeout_ms = 8;  // 建议默认超时，调用方仍可收紧
  string description = 9;  // 人类可读说明
}

message ListCapabilitiesResponse {
  repeated CapabilityDescriptor capabilities = 1;
}

// 命令式能力分发：新增业务线优先扩展 capability_id + payload_json，避免加 RPC。
message DispatchCapabilityRequest {
  string capability_id = 1;  // 与 CapabilityDescriptor.capability_id 对齐
  string tenant_id = 2;
  string user_id = 3;
  string conversation_id = 4;  // 无会话场景可空字符串，由宿主校验
  /// JSON 对象字符串；建议首层含 schema 或 version 字段便于多版本共存。
  string payload_json = 5;
  string request_id = 6;  // 幂等与链路追踪，应与 gRPC metadata 一致或可关联
  // 插件卡片动作或详情来自的那条消息（server_msg_id）；非卡片调用为空。Core 只接受实体绑定的那条卡片
  // 发起的、针对该实体的调用（伪造或转发的副本拒绝 PLUGIN_CARD_UNBOUND）。
  string message_id = 7;
}

// Dispatch 执行结果；失败时 success=false 且 error_message 可读，严重错误仍可用 Status。
message CapabilityDispatchResult {
  string request_id = 1;
  bool success = 2;
  string plugin_id = 3;
  string capability_id = 4;
  string result_json = 5;  // JSON 字符串，建议与 payload 对称带 schema 版本
  string error_message = 6;
}

message DispatchCapabilityResponse {
  CapabilityDispatchResult result = 1;
}

message SetTenantCapabilitySwitchRequest {
  string tenant_id = 1;
  string capability_id = 2;
  bool enabled = 3;
}

message SetTenantCapabilitySwitchResponse {
  string message = 1;
}

// ----------------------------------------------------------------------------
// 插件实例诊断 — 只读，来自应用的已授权插件快照
// ----------------------------------------------------------------------------

message ListRegisteredPluginsRequest {
  string tenant_id = 1;
  // 可选：按能力过滤；空表示租户下全部实例
  string capability_id = 2;
}

message RegisteredPluginInstance {
  string plugin_id = 1;
  string capability_id = 2;
  string grpc_authority = 3;
  map<string, string> labels = 4;

  string plugin_version = 5;
  string api_version = 6;
  string manifest_sha256 = 7;
  repeated string declared_operations = 8;
  // 未验证实例仅用于诊断展示，禁止接收业务调用。
  bool unverified = 9;
}

message ListRegisteredPluginsResponse {
  repeated RegisteredPluginInstance instances = 1;
}

// ----------------------------------------------------------------------------
// CapabilityAdminService — 管理员只读
// ----------------------------------------------------------------------------

// 租户取自 admin 令牌
message ListTenantCapabilitySwitchesRequest {}

message TenantCapabilitySwitch {
  string capability_id = 1;
  bool enabled = 2;  // false = 装过但停用；未出现在列表里 = 从未设置
  google.protobuf.Timestamp updated_at = 3;
}

message ListTenantCapabilitySwitchesResponse {
  string tenant_id = 1;  // 令牌租户（规范形式）
  repeated TenantCapabilitySwitch switches = 2;  // 按 capability_id 升序
}

// 租户取自 admin 令牌
message GetTenantRuntimeRequest {}

// 本进程持有的租户投影（控制面经 TenantProjection 推送）。projected=false 时除 tenant_id 外均为零值。
message GetTenantRuntimeResponse {
  string tenant_id = 1;  // 令牌租户（规范形式）
  bool projected = 2;  // 本地 tenants 表是否有该租户的行（含 version=0 的预置行）
  string name = 3;
  flare.control.v1.TenantStatus status = 4;
  flare.control.v1.TenantQuota quota = 5;  // 0 = 不限
  string settings_json = 6;  // 控制面透传的设置（JSON 对象文本），核不解释
  uint64 version = 7;  // 本地持有的投影版本；0 = 预置行，未收到过投影
  google.protobuf.Timestamp projected_at = 8;  // 最近一次接受投影的时间；未投影过为空
  google.protobuf.Timestamp updated_at = 9;
}

// ----------------------------------------------------------------------------
// Hook 共用类型 — 显式核心 + 扩展槽 + 路由建议（飞书式「固定 + 自定义」）
// ----------------------------------------------------------------------------

// 扩展槽：轻量 KV + 命名空间化 Any；键建议反向 DNS（如 com.lark.card.v1）。
message HookExtensionBag {
  uint32 contract_version = 1;  // 宿主与插件协商的契约版本，默认 0
  map<string, string> attributes = 2;
  map<string, google.protobuf.Any> extensions = 3;
}

// 宿主侧路由/编排提示；非强制，实现可忽略或按租户策略覆盖。
message HookRoutingHints {
  bool suppress_push = 1;
  repeated string push_channel_allowlist = 2;  // 空 = 不限制；非空 = 仅允许列出渠道
  bool suppress_offline_apns = 3;
  bool suppress_offline_fcm = 4;
  bool defer_async_side_effects = 5;  // 建议异步落库/外呼，不阻塞主链
  string audit_severity = 6;  // info | notice | warn（审计分级，可选）
}

// ----------------------------------------------------------------------------
// 消息 Hook — 发前
// ----------------------------------------------------------------------------
// PreSend：可放行、拒绝或回写草稿。与核心消息写路径顺序、seq 分配策略的配合由调用文档约定，
// 本 proto 不承载 seq。

// Hook 调用上下文：与 gRPC metadata（trace、tenant、actor）互补。
// tags/attributes 为轻量透传；结构化扩展用 extension_bag（与飞书回调 header 类似）。
message HookInvocationContext {
  string conversation_id = 1;  // 会话 ID
  string conversation_type = 2;  // 会话类型（single/group/channel）
  string corridor = 3;  // 通道（messaging/signaling/push）
  map<string, string> tags = 4;  // 标签（路由/选择器）
  map<string, string> attributes = 5;  // 轻量扩展 KV
  string tenant_id = 6;  // 租户（与 metadata x-tenant-id 应对齐）
  string app_id = 7;  // 应用 / ISV 应用 ID，无则空
  string operator_user_id = 8;  // 触发该次调用的用户（系统动作可空）
  string request_id = 9;  // 与 GenericRequest.request_id 一致，便于幂等与排障
  HookExtensionBag extension_bag = 10;  // 命名空间化强类型扩展
}

// 消息草稿（Hook 可修改）；PreSend 前可能尚无 server message_id。
message HookMessageDraft {
  string message_id = 1;  // 服务端消息 ID，预分配时有效，否则空
  string client_message_id = 2;  // 客户端消息 ID（去重幂等）
  string conversation_id = 3;  // 会话 ID
  bytes payload = 4;  // 载荷
  map<string, string> headers = 5;  // 头
  map<string, string> metadata = 6;  // 轻量扩展
  string message_type = 7;  // 与 flare.common.v1.Message.type 对齐的字符串
  string parent_message_id = 8;  // 线程 / 回复根消息，无则空
  bool is_silent = 9;  // 静默消息（少通知/不推送等语义由宿主解释）
  HookExtensionBag extension_bag = 10;  // 业务自定义区；可回写由宿主持久化策略决定
}

// 发前 Hook 请求
message PreSendHookRequest {
  HookInvocationContext context = 1;  // 上下文
  HookMessageDraft draft = 2;  // 草稿
}

// 发前 Hook 响应
message PreSendHookResponse {
  bool allow = 1;  // 是否允许发送
  HookMessageDraft draft = 2;  // 修改后草稿（allow=true 时有效）
  HookRoutingHints routing = 3;  // 推送/异步等编排建议
  map<string, string> annotations = 4;  // 透传注解（审计、下游只读）
  HookExtensionBag outcome_extensions = 5;  // 结构化扩展回写
  string deny_reason_code = 6;  // allow=false 时机器可读原因
  string deny_reason_message = 7;  // 人类可读，可展示给运营
}

// ----------------------------------------------------------------------------
// Hook 配置与统计 — 控制面（Capability 写配置、读统计；运行时在 Message Ingest）
// ----------------------------------------------------------------------------

// 一条 Hook = 一个点位（hook_type）+ 一个目标（transport）。tenant_id 空是平台 Hook，否则是应用
// Hook。部署 Hook 在部署文件里，不走这条消息，见 HookProfile。点位目录见 hook_point.list。
message HookConfig {
  reserved 9, 12, 13;

  string hook_id = 1;  // Hook ID
  string name = 2;  // 名称
  string hook_type = 3;  // 点位的存储名（pre_send）
  string tenant_id = 4;  // 应用 ID；空为平台
  int32 order = 5;  // 同一来源内的先后 0–1000，越小越先
  bool enabled = 6;  // 是否启用
  HookTransport transport = 7;  // 目标
  HookSelector selector = 8;  // 匹配条件，空=全部
  google.protobuf.Timestamp created_at = 10;  // 创建时间
  google.protobuf.Timestamp updated_at = 11;  // 更新时间
  bool required = 14;  // 必需：目标不可用时回可重试的 503；否则跳过
}

// Hook 目标：grpc 走 service_name 服务发现或 endpoint 直连；webhook 用 endpoint。
message HookTransport {
  reserved 9;

  string type = 1;  // 类型（grpc/webhook）
  string service_name = 2;  // 服务发现名，type=grpc 时优先
  string endpoint = 3;  // 直连地址或 Webhook URL
  string registry_type = 4;  // 注册类型（etcd/consul/mesh）
  string namespace = 5;  // 命名空间
  string load_balance = 6;  // 负载均衡（round_robin/least_conn/...）
  string secret = 7;  // webhook 签名
  map<string, string> headers = 8;  // 请求头
  int32 timeout_ms = 10;  // 这条 Hook 的超时毫秒
  map<string, string> metadata = 11;  // 扩展
}

// Hook 匹配条件：只有运行时实际判断的字段（`flare_im_hooks::HookSelectorConfig`），空=全部。
message HookSelector {
  reserved 4, 5, 6, 7;

  repeated string tenants = 1;  // 应用
  repeated string conversation_types = 2;  // 会话类型
  repeated string message_types = 3;  // 消息类型
}

// 创建 Hook 配置请求
message CreateHookConfigRequest {
  reserved 7, 8, 9;

  string name = 1;  // 名称
  string hook_type = 2;  // 点位的存储名
  string tenant_id = 3;  // 应用 ID；空为平台
  int32 order = 4;  // 同一来源内的先后
  HookTransport transport = 5;  // 目标
  HookSelector selector = 6;  // 匹配条件
  bool required = 10;  // 必需
}

// 创建 Hook 配置响应
message CreateHookConfigResponse {
  HookConfig config = 1;  // 配置
}

// 获取 Hook 配置请求
message GetHookConfigRequest {
  string hook_id = 1;  // Hook ID
}

// 获取 Hook 配置响应
message GetHookConfigResponse {
  HookConfig config = 1;  // 配置
}

// 更新 Hook 配置请求：没给的字段不变
message UpdateHookConfigRequest {
  reserved 6, 7, 8;

  string hook_id = 1;  // Hook ID
  string name = 2;  // 名称
  optional int32 order = 3;  // 同一来源内的先后
  HookTransport transport = 4;  // 目标
  HookSelector selector = 5;  // 匹配条件
  optional bool required = 9;  // 必需
}

// 更新 Hook 配置响应
message UpdateHookConfigResponse {
  HookConfig config = 1;  // 配置
}

// 列出 Hook 配置请求
message ListHookConfigsRequest {
  string tenant_id = 1;  // 应用 ID；空为平台。只列这个范围自己的行
  string hook_type = 2;  // 类型过滤
  bool enabled_only = 3;  // 仅启用
  flare.common.v1.Pagination pagination = 4;  // 分页
}

// 列出 Hook 配置响应
message ListHookConfigsResponse {
  repeated HookConfig configs = 1;  // 配置列表
  flare.common.v1.Pagination pagination = 2;
}

// 删除 Hook 配置请求
message DeleteHookConfigRequest {
  string hook_id = 1;  // Hook ID
}

// 删除 Hook 配置响应
message DeleteHookConfigResponse {
  bool success = 1;  // 是否成功
}

// 设置 Hook 状态请求
message SetHookStatusRequest {
  string hook_id = 1;  // Hook ID
  bool enabled = 2;  // 是否启用
}

// 设置 Hook 状态响应
message SetHookStatusResponse {
  bool success = 1;  // 是否成功
}

// 点位目录里的一个点位
message HookPointEntry {
  string id = 1;  // 对外的点位名（message.pre_send）
  string hook_type = 2;  // 存储名（pre_send）
  string summary = 3;  // 说明
}

// 列出 Hook 点位请求
message ListHookPointsRequest {}

// 列出 Hook 点位响应
message ListHookPointsResponse {
  repeated HookPointEntry points = 1;  // 点位目录
}

// 部署文件里的一条 Hook：只读，不带密钥、请求头和 metadata 的值
message DeploymentHook {
  string name = 1;  // 名称
  string hook_type = 2;  // 点位的存储名
  string description = 3;  // 描述
  bool enabled = 4;  // 是否启用
  int32 order = 5;  // 同一来源内的先后
  bool required = 6;  // 必需
  int64 timeout_ms = 7;  // 超时毫秒
  string target_type = 8;  // 目标类型（grpc/webhook/local）
  string target_endpoint = 9;  // 目标地址，不含查询串
  HookSelector selector = 10;  // 匹配条件
}

// 一个服务装载的部署 Hook（`hook_deployment_summary` 的一行）
message HookProfile {
  string service = 1;  // 服务名
  string source = 2;  // 部署文件路径
  string instance_id = 3;  // 最后写入的实例
  google.protobuf.Timestamp loaded_at = 4;  // 装载时间
  repeated DeploymentHook hooks = 5;  // 已装载的 Hook
}

// 列出部署 Hook 请求
message ListHookProfilesRequest {}

// 列出部署 Hook 响应
message ListHookProfilesResponse {
  repeated HookProfile profiles = 1;  // 每个服务一条
}

// 测试调用请求：用样例载荷调用目标一次，不进发送路径。给 hook_id 用已存的目标（含密钥），否则用
// transport。hook_id 与 transport 同时给时 transport 优先，空的密钥、头沿用已存的值。
message TestHookConfigRequest {
  string hook_id = 1;  // 已存的 Hook
  string hook_type = 2;  // 点位的存储名
  HookTransport transport = 3;  // 目标
}

// 测试调用响应
message TestHookConfigResponse {
  string outcome = 1;  // allowed / rewritten / rejected / identity_required / failed
  int64 latency_ms = 2;  // 耗时
  string code = 3;  // 拒绝原因码或失败类别（timeout/unavailable/bad_response）
}

// Hook 统计
message HookStatistics {
  string hook_id = 1;  // Hook ID
  int64 total_executions = 2;  // 总执行次数
  int64 success_count = 3;  // 成功次数
  int64 failure_count = 4;  // 失败次数
  double avg_latency_ms = 5;  // 平均延迟（毫秒）
  double p99_latency_ms = 6;  // P99 延迟（毫秒）
  int64 rate_limit_count = 7;  // 限流次数
  int64 circuit_break_count = 8;  // 熔断次数
  map<string, int64> error_count_by_code = 9;  // 按错误码统计
}

// 获取 Hook 统计请求
message GetHookStatisticsRequest {
  string hook_id = 1;  // Hook ID
  flare.common.v1.TimeRange time_range = 2;  // 时间范围，空=最近 24h
}

// 获取 Hook 统计响应
message GetHookStatisticsResponse {
  HookStatistics statistics = 1;  // 统计
}

// Hook 单次执行记录
message HookExecution {
  string execution_id = 1;  // 执行 ID
  string hook_id = 2;  // Hook ID
  string message_id = 3;  // 消息 ID
  bool success = 4;  // 是否成功
  int32 latency_ms = 5;  // 延迟（毫秒）
  string error_code = 6;  // 错误码
  string error_message = 7;  // 错误信息
  google.protobuf.Timestamp executed_at = 8;  // 执行时间
}

// 查询 Hook 执行请求
message QueryHookExecutionsRequest {
  string hook_id = 1;  // Hook ID
  string message_id = 2;  // 消息 ID
  bool success_only = 3;  // 仅成功
  flare.common.v1.TimeRange time_range = 4;  // 时间范围
  flare.common.v1.Pagination pagination = 5;  // 分页
}

// 查询 Hook 执行响应
message QueryHookExecutionsResponse {
  repeated HookExecution executions = 1;  // 执行列表
  flare.common.v1.Pagination pagination = 2;
}

// Shared plugin process control. Implemented by the plugin host on its existing
// gRPC listener; not another gateway/control microservice. Inspect is public
// metadata only. ApplyTenant requires a short platform-worker control assertion
// whose audience binds the deployment and whose tenant binds app_id.
service PluginRuntime {
  rpc Inspect(PluginRuntimeInspectRequest) returns (PluginRuntimeInspectResponse);
  rpc ApplyTenant(PluginTenantState) returns (PluginTenantStateAck);
}
message PluginRuntimeInspectRequest {}
message PluginRuntimeInspectResponse {
  string deployment_id = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  string manifest_digest = 4;
  string artifact_digest = 5;
  bool ready = 6;
  bool draining = 7;
  // Platform protocols this deployment serves besides its manifest operations, for example
  // "flare.plugin.data.v1" (data export). The platform enables a version that promises one only
  // on a deployment reporting it.
  repeated string protocols = 8;
}
message PluginTenantState {
  string deployment_id = 1;
  string app_id = 2;
  string grant_id = 3;
  uint64 revision = 4;
  string manifest_digest = 5;
  bytes configuration_json = 6;
  string configuration_digest = 7;
  bool enabled = 8;
  int64 valid_until_ms = 9;
  // Normal preparation validates plugin configuration before installation ACK.
  // An authenticated emergency deny may bypass business validation, never enable.
  bool validate_configuration = 10;
  // Immutable app owner resolved by Catalog and covered by the control worker's signature.
  string organization_id = 11;
  // Same platform-approved grant projected to the deployment for explicitly
  // authenticated workload reads. Empty projections deny these new reads;
  // existing ticket-based user/staff invocations remain separately admitted.
  repeated string approved_operations = 12;
  repeated string permissions = 13;
  repeated string data_scopes = 14;
}
message PluginTenantStateAck {
  uint64 revision = 1;
  string configuration_digest = 2;
  bool enabled = 3;
}
