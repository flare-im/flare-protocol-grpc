syntax = "proto3";

package flare.control.v1;

option go_package = "github.com/flare-labs/flare/proto/control/v1;controlv1";

// =============================================================================
// TenantProjection(控制面 → 数据面的租户/开关投影)
// =============================================================================
// 真源在控制面(flare-social-server/platform/control)。数据面(flare-social 的 flare-social-control、
// flare-im-core 的 capability 进程)各实现一份本服务,只负责把投影落到本地表并按
// version 幂等:收到的 version 小于等于本地已有版本即丢弃并返回当前版本。
//
// 核只有能力开关(CapabilityService.SetTenantCapabilitySwitch),不消费功能开关投影:
// 核对 UpsertFeatureFlags 返回 UNIMPLEMENTED。
//
// im_tenant_id 是数据面通用的租户 ID(默认租户 "0");控制面自身的租户主键不出现在
// 本协议里。`*` 只用于功能开关的平台级默认行,租户投影不允许 `*`。

service TenantProjection {
  rpc UpsertTenant(TenantProjectionUpsert) returns (ProjectionAck);
  rpc UpsertFeatureFlags(FeatureFlagsProjectionUpsert) returns (ProjectionAck);
  rpc UpsertCredentials(CredentialsProjectionUpsert) returns (ProjectionAck);
  // Authenticated full app plugin snapshot; Core persists it locally. Market
  // queries and unsigned endpoint registration never create runtime grants.
  rpc UpsertPlugins(PluginsProjectionUpsert) returns (ProjectionAck);
  // 平台级角色权限包(员工角色 → 权限码、已吊销会话 jti、员工会话验签公钥集)。
  // 只有 Social 投影接收端实现(供统一网关 admin 分区本地授权);核返回 UNIMPLEMENTED。
  // 令牌租户范围必须是 `*`;整份替换,按 version 幂等。
  rpc UpsertRoleBundle(RoleBundleProjectionUpsert) returns (ProjectionAck);
  // 应用的接入/发布水位与构建策略,在 Core 与 Social 各落一份;整份替换,按 version 幂等。
  // Core 接受更高版本后,在同一事务里排队 flare.access / flare.release 租户通知。
  rpc UpsertClientPolicy(ClientPolicyUpsert) returns (ProjectionAck);
  rpc GetVersions(GetVersionsRequest) returns (ProjectionVersions);
}

// =============================================================================
// ClientBuildStats(平台从核读应用的在线构建分布)
// =============================================================================
// 只有核(capability 进程)实现。各接入网关每 30s 把本实例的（平台，构建）在线连接数写进
// Redis(TTL 120s),这里把仍在存活窗口内的网关汇总起来。数据最多滞后一个上报周期,
// 网关宕机后最多 120s 退出统计。鉴权:平台 worker 的控制断言,audience 是只读的
// `flare-core-build-stats`(与 TenantProjection 的 `flare-core-projection` 互不通用),
// 令牌租户必须正是请求的 app_id;平台级 `*` 拒绝(PERMISSION_DENIED)。

service ClientBuildStats {
  rpc GetConnectionBuilds(GetConnectionBuildsRequest) returns (ConnectionBuilds);
}

message GetConnectionBuildsRequest {
  string app_id = 1;  // im_tenant_id,规范形式
}

message ConnectionBuildCount {
  // 发布清单平台段:web / android / ios / tauri / electron;另有 harmonyos 与 other
  string platform = 1;
  // 构建号;0 = 客户端没报。older_builds = true 时恒为 0
  uint64 app_build = 2;
  uint64 connections = 3;
  // true:该平台在列出的构建之外、更旧构建的合计(每个平台最多列 20 个最新构建)
  bool older_builds = 4;
}

message ConnectionBuilds {
  string app_id = 1;
  // 按 platform 升序;同一平台内构建号降序,older_builds 行排在该平台最后
  repeated ConnectionBuildCount builds = 2;
  uint32 gateways = 3;          // 参与汇总的网关数
  int64 collected_at_ms = 4;    // 汇总时刻(Unix 毫秒)
}

// ----------------------------------------------------------------------------
// 租户投影
// ----------------------------------------------------------------------------

enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_ACTIVE = 1;
  TENANT_STATUS_SUSPENDED = 2;  // 拒新连、拒重连、拒登录/refresh/签 IM token;数据不删
  TENANT_STATUS_DELETING = 3;   // 等价 SUSPENDED + 后台清理中
}

// 核侧执行的运行时配额;0 = 不限,回落全局配置
message CoreQuota {
  uint32 send_qps = 1;
  uint32 sync_pull_qps = 2;
  uint32 max_online_devices_per_user = 3;
}

// 0 = 不限
message TenantQuota {
  uint32 max_users = 1;
  uint32 max_groups = 2;
  uint32 max_group_members = 3;
  CoreQuota core = 4;
}

message TenantProjectionUpsert {
  string im_tenant_id = 1;
  string name = 2;
  TenantStatus status = 3;
  TenantQuota quota = 4;
  bytes settings_json = 5;  // 品牌/locale 等非开关设置;Social 只透传给公开 /features 快照
  uint64 version = 6;       // 控制面全局单调序列
  // 拥有该应用的控制面组织 id(纯数字,最长 20 字节);统一网关据此校验员工会话的组织作用域。
  // 数据面不解释它,也不以它做任何业务路由;缺省为空。
  string organization_id = 7;
}

// ----------------------------------------------------------------------------
// 功能开关投影(整租户快照,接收端整租户替换)
// ----------------------------------------------------------------------------

message FeatureFlagRow {
  string key = 1;             // 开关注册表里的 key,如 "invite.mode"
  bool enabled = 2;           // 总闸;false 时 rules 不评估
  bytes config_json = 3;      // 行级 config(JSON 对象)
  bytes rules_json = 4;       // 有序规则数组(JSON),见 features.registry 文档;空 = 无规则
  int64 effective_from_ms = 5;   // 0 = 无下界
  int64 effective_until_ms = 6;  // 0 = 无上界
}

message FeatureUserOverride {
  string key = 1;
  string user_id = 2;
  bool enabled = 3;
  bytes config_json = 4;     // 空 = 沿用行级/默认 config
  int64 expires_at_ms = 5;   // 0 = 不过期
}

message FeatureFlagsProjectionUpsert {
  string im_tenant_id = 1;   // "*" = 平台默认
  repeated FeatureFlagRow flags = 2;
  repeated FeatureUserOverride overrides = 3;
  uint64 version = 4;
}

// ----------------------------------------------------------------------------
// 应用凭证投影（仅受认证 ProjectionWorker 可写，本地落盘，不回查 Control）
// ----------------------------------------------------------------------------
enum ApiKeyMode {
  API_KEY_MODE_UNSPECIFIED = 0; // 必须拒绝，不能当作 live
  API_KEY_MODE_LIVE = 1;
  API_KEY_MODE_TEST = 2;
}

message CredentialKey {
  string key_id = 1;             // 12位大写RFC4648 base32，不是明文token
  string service_account_id = 2;
  ApiKeyMode mode = 3;
  bytes hash = 4;                // 正好32字节 SHA256(raw pepper || raw secret)
  bytes pepper_fingerprint = 5;  // 正好32字节 SHA256(raw pepper)，不是pepper
  repeated string scopes = 6;    // 显式端点作用域，无通配，最多16个
  int64 expires_at_ms = 7;       // 0=无到期；负数必须拒绝，无刷新宽限
  repeated string ip_allow = 8;  // canonical CIDR，最多32项
  bool revoked = 9;              // 接收器必须拒绝撤销Key
  bool service_account_enabled = 10; // 缺字段=false，fail closed
}

// 全应用快照，事务中原子替换并保留版本水位；空keys是合法的全部撤销。
// 控制面通常仅投递仍可能使用的Key；缺失Key必须拒绝，不回查Control或旧凭据。
// app_id是永久运行租户映射，不是Organization主键，也不是假Environment。
// 接收器必须验证签名worker、精确app租户范围、非零单调版本、绑定、重复key_id、
// mode、材料长度、作用域和CIDR；默认最大1024项。旧/同版本不改变数据。
// 不得将此消息或其Debug输出到普通日志；没有token、secret或pepper字段。
message CredentialsProjectionUpsert {
  string app_id = 1;
  uint64 version = 2;
  repeated CredentialKey keys = 3;
}

// JSON is the canonical flare-plugin-protocol PluginRuntimeSnapshot. Receivers
// enforce the exact app/version binding, 2 MiB bound, lease, manifest digests,
// deployment bindings and permission subsets before an atomic replacement.
message PluginsProjectionUpsert {
  string app_id = 1;
  uint64 version = 2;
  bytes snapshot_json = 3;
}

// ----------------------------------------------------------------------------
// 角色权限包投影(平台级,整份快照)
// ----------------------------------------------------------------------------
// 真源是控制面 IAM。统一网关 admin 分区用它把员工会话里的角色展开成权限码集合、拒绝已吊销
// 的会话、并用 iam_public_keys_jwks 本地验签员工会话,不回查控制面(不变量:数据面不依赖
// 控制面在线)。
message RoleGrant {
  string role_id = 1;             // 控制面角色主键;平台虚拟角色为 "platform:super_admin"
  string scope_type = 2;          // "platform" | "org"
  string scope_id = 3;            // scope_type=org 时为组织 id;platform 为空
  string code = 4;                // 角色码,如 im_admin / im_operator / super_admin
  repeated string permissions = 5; // 权限码集合,去重、升序;最多 1024 个
}

message RoleBundleProjectionUpsert {
  uint64 version = 1;                      // 控制面全局单调序列
  repeated RoleGrant roles = 2;            // 最多 4096 条
  repeated string revoked_session_jti = 3; // 已吊销但未过期的员工会话 jti;最多 4096 条
  bytes iam_public_keys_jwks = 4;          // JWKS(JSON 对象,{"keys":[{kty:"OKP",crv:"Ed25519",kid,x}]}),≤ 64 KiB
}

// ----------------------------------------------------------------------------
// 客户端策略投影(整应用快照)
// ----------------------------------------------------------------------------
// 只在清单回读确认之后投影:客户端收到通知时一定拉得到新文档。access_serial 与
// release_generation 是只进不退的水位,更高的 version 带来更小的值时接收端保留原值。
// 版本比较只看 version;水位前进才发通知,build_policies 单独变化不发。
message BuildRange {
  uint64 from = 1;  // 含
  uint64 to = 2;    // 含,不小于 from
}

message BuildPolicy {
  uint64 min_build = 1;                    // 0 = 不限
  int64 min_build_effective_from_ms = 2;   // 0 = 立即生效;负数必须拒绝
  repeated BuildRange blocked = 3;         // 最多 64 段
}

message ClientPolicyUpsert {
  string app_id = 1;
  uint64 version = 2;             // 投影版本(幂等),非零
  uint64 access_serial = 3;       // 已发布的接入清单 serial;0 = 从未发布
  uint64 release_generation = 4;  // 应用级计数:该应用任一发布清单发布即 +1;0 = 从未发布
  map<string, BuildPolicy> build_policies = 5;  // key = platform([a-z0-9_-]{1,32}),最多 32 项
}

// ----------------------------------------------------------------------------
// 通用
// ----------------------------------------------------------------------------

message ProjectionAck {
  bool accepted = 1;           // false = 因版本过旧被忽略
  uint64 current_version = 2;  // 接收端当前持有的版本
}

message GetVersionsRequest {
  repeated string im_tenant_ids = 1;  // 空 = 全部
}

message TenantVersions {
  uint64 tenant_version = 1;    // 0 = 未投影
  uint64 features_version = 2;  // 0 = 未投影 / 接收端不支持
  uint64 credentials_version = 3; // 空凭证快照也保留版本水位
  uint64 role_bundle_version = 4; // 只在 key = "*" 的条目上有意义;其余为 0
  uint64 plugins_version = 5;
  uint64 client_policy_version = 6;
}

message ProjectionVersions {
  map<string, TenantVersions> versions = 1;  // key = im_tenant_id
}
