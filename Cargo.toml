[package]
name = "flare-grpc-proto"
version = "2.3.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Flare IM gRPC 服务 proto 生成（tonic client/server + 消息），依赖 flare-proto 基础类型"
repository = "https://github.com/flare-im/flare-protocol-grpc"
homepage = "https://github.com/flare-im/flare-protocol-grpc"
documentation = "https://docs.rs/flare-grpc-proto"

[dependencies]
flare-proto = { version = "2.1.0", path = "../flare-protocol" }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
flare-proto = { version = "2.1.0", path = "../flare-protocol" }
tonic-prost-build = "0.14"
